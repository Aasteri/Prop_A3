name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          BODY="{}"
          if [ -n "${SMTP_PASS:-}" ]; then
            BODY=$(python3 -c 'import json,os; print(json.dumps({"smtpPass": os.environ["SMTP_PASS"]}))')
          fi
          curl -sf -X POST "https://propa3.com/api/deploy/hook" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_HOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY"

      - name: Wait for deploy + verify new routes (t3.micro is slow)
        run: |
          # Health alone is not enough: an old PM2 process stays healthy while
          # deploy.sh fails (e.g. prisma db push). Probe a post-BRD route:
          # 401 = mounted (auth required), 404 = stale build still running.
          for i in $(seq 1 30); do
            if ! curl -sf https://propa3.com/api/health >/dev/null; then
              echo "Health down, waiting... attempt $i"
              sleep 30
              continue
            fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://propa3.com/api/charters || true)
            echo "attempt $i: /api/charters -> $CODE"
            if [ "$CODE" = "401" ] || [ "$CODE" = "200" ]; then
              echo "Deploy verified: new routes are live"
              exit 0
            fi
            sleep 30
          done
          echo "Deploy did not expose /api/charters within ~15m — check /var/log/propa3-deploy.log on EC2"
          exit 1
